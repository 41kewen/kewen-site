<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">博客迁移前后的部署路径对比</title>
  <desc id="desc">旧路径依赖公网入口、FRP、家庭网络和本地 Apache；新路径由 Cloudflare 将请求转发到 Vercel 的静态页面和 Serverless API。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8f8999"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8f7ee7"/>
    </marker>
    <style>
      .bg{fill:#0a0a0c}.panel{fill:#111117;stroke:#302c3a;stroke-width:2}
      .node{fill:#17151e;stroke:#696171;stroke-width:2}.node-ok{fill:#17151e;stroke:#8f7ee7;stroke-width:2}
      .label{fill:#e8e2d6;font:500 26px system-ui,-apple-system,"Segoe UI",sans-serif}
      .small{fill:#aaa3b5;font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif}
      .heading{fill:#f3eee5;font:500 34px system-ui,-apple-system,"Segoe UI",sans-serif}
      .old{fill:#df8191}.new{fill:#a99bf2}
      .line{fill:none;stroke:#8f8999;stroke-width:3;marker-end:url(#arrow)}
      .line-ok{fill:none;stroke:#8f7ee7;stroke-width:3;marker-end:url(#arrow-ok)}
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>
  <text class="heading" x="50" y="52">部署路径对比</text>

  <rect class="panel" x="40" y="80" width="1320" height="285"/>
  <text class="label old" x="70" y="126">旧路径：家庭服务器 + FRP</text>

  <rect class="node" x="70" y="170" width="180" height="80"/>
  <text class="label" x="160" y="220" text-anchor="middle">访客</text>

  <rect class="node" x="325" y="170" width="190" height="80"/>
  <text class="label" x="420" y="205" text-anchor="middle">公网入口</text>
  <text class="small" x="420" y="234" text-anchor="middle">单一中继</text>

  <rect class="node" x="590" y="170" width="180" height="80"/>
  <text class="label" x="680" y="220" text-anchor="middle">FRP 隧道</text>

  <rect class="node" x="845" y="170" width="190" height="80"/>
  <text class="label" x="940" y="205" text-anchor="middle">家庭网络</text>
  <text class="small" x="940" y="234" text-anchor="middle">NAT / 路由</text>

  <rect class="node" x="1110" y="170" width="200" height="80"/>
  <text class="label" x="1210" y="205" text-anchor="middle">Apache</text>
  <text class="small" x="1210" y="234" text-anchor="middle">静态站点</text>

  <path class="line" d="M250 210 H325"/>
  <path class="line" d="M515 210 H590"/>
  <path class="line" d="M770 210 H845"/>
  <path class="line" d="M1035 210 H1110"/>

  <text class="small" x="70" y="316">公开请求依赖每一个环节；中继、隧道、家庭宽带或本地服务异常都可能表现为“无法访问”。</text>

  <rect class="panel" x="40" y="400" width="1320" height="325"/>
  <text class="label new" x="70" y="446">新路径：Cloudflare + Vercel</text>

  <rect class="node-ok" x="90" y="520" width="180" height="80"/>
  <text class="label" x="180" y="570" text-anchor="middle">访客</text>

  <rect class="node-ok" x="390" y="500" width="230" height="120"/>
  <text class="label" x="505" y="548" text-anchor="middle">Cloudflare</text>
  <text class="small" x="505" y="582" text-anchor="middle">DNS · HTTPS · 边缘代理</text>

  <rect class="node-ok" x="750" y="500" width="220" height="120"/>
  <text class="label" x="860" y="548" text-anchor="middle">Vercel</text>
  <text class="small" x="860" y="582" text-anchor="middle">托管与执行</text>

  <rect class="node-ok" x="1090" y="472" width="220" height="78"/>
  <text class="label" x="1200" y="521" text-anchor="middle">静态页面</text>

  <rect class="node-ok" x="1090" y="590" width="220" height="78"/>
  <text class="label" x="1200" y="639" text-anchor="middle">Serverless API</text>

  <path class="line-ok" d="M270 560 H390"/>
  <path class="line-ok" d="M620 560 H750"/>
  <path class="line-ok" d="M970 540 C1020 540 1020 511 1090 511"/>
  <path class="line-ok" d="M970 580 C1020 580 1020 629 1090 629"/>

  <text class="small" x="70" y="690">家庭宽带与 FRP 退出公共页面请求路径；静态内容和 API 分别由平台承载。</text>
</svg>
